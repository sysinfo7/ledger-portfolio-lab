name: Verify portfolio sources
on: [push, pull_request]

jobs:
  public-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
        working-directory: public-demo

  live-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: live-app/package-lock.json
      - run: npm ci
        working-directory: live-app
      - run: node --test tests/*.test.mjs
        working-directory: live-app
      - run: npx tsc --noEmit
        working-directory: live-app
      - run: npm run build
        working-directory: live-app
